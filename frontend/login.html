<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Student Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <!-- minimal top navbar for authentication pages -->
  <header class="navbar">
    <div class="brand-group">
      <span class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M9 11l3 3L22 4" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="brand-title">Student Task Manager</span>
    </div>
    <div class="navbar-right">
      <span class="context-pill">Academic Tasks</span>
    </div>
  </header>

  <main class="auth-canvas">
    <section class="auth-card" aria-label="Login">
      <div>
        <div class="auth-kicker">LOGIN</div>
        <h1 class="auth-title">Student Task Manager</h1>
        <p class="auth-subtitle">Sign in to manage academic tasks.</p>
      </div>

      <div class="divider"></div>

      <div id="authAlert" class="alert alert-error alert-hidden" role="alert">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
          <line x1="12" y1="8" x2="12" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="12" y1="16" x2="12.01" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="alert-text"></span>
      </div>

      <form id="loginForm" class="auth-form" novalidate>
        <div class="field">
          <label class="field-label" for="loginIdentifier">Email / NIM *</label>
          <input id="loginIdentifier" class="input" type="text" placeholder="Enter your email or NIM" autocomplete="username" required>
        </div>

        <div class="field">
          <label class="field-label" for="loginPassword">Password *</label>
          <input id="loginPassword" class="input" type="password" placeholder="Enter your password" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-full">Sign In</button>
      </form>

      <div class="auth-switch">
        Don't have an account? <a href="/register.html">Create an account / Register</a>
      </div>

      <div class="divider"></div>

      <p class="auth-note">
        For academic prototype purposes. Session state runs in-memory without a persistent database.
      </p>
    </section>
  </main>

  <script type="module" src="/js/auth.js"></script>
</body>
</html>
